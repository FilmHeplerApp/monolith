x-php-service: &php-service
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    working_dir: /var/www/app
    volumes:
        - ./:/var/www/app
        - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    networks:
        - film-app-network

services:
    app:
        <<: *php-service

        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-app
        environment:
            PHP_IDE_CONFIG: "serverName=film-helper-app"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    nginx:
        image: nginx:1.27-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-nginx
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www/app
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/up"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - film-app-network

    postgres:
        image: pgvector/pgvector:pg16
        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-postgres
        ports:
            - "${DB_FORWARD_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE:-filmhelper}
            POSTGRES_USER: ${DB_USERNAME:-filmhelper}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-filmhelper} -d ${DB_DATABASE:-filmhelper}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - film-app-network

    redis:
        image: redis:7.4-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-redis
        ports:
            - "${REDIS_FORWARD_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        networks:
            - film-app-network

    horizon:
        <<: *php-service
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-horizon
        working_dir: /var/www/app
        command: php artisan horizon
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "php artisan horizon:status | grep -q running" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    scheduler:
        <<: *php-service

        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-scheduler
        command: php artisan schedule:work
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    minio:
        image: minio/minio:latest
        container_name: ${COMPOSE_PROJECT_NAME:-filmhelper}-minio
        command: server /data --console-address ":9001"
        ports:
            - "${MINIO_API_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret}
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - film-app-network

networks:
    film-app-network:
        driver: bridge

volumes:
    postgres-data:
    minio-data:
